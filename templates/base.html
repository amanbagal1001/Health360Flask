<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf8">
<title>{% block title %}Health360 | Smart Healthcare Analytics{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><div class="topwash"></div>
<header class="header"><a class="brand" href="{{ url_for('home') }}"><b class="mark">H<span>+</span></b>Health<span>360</span></a>
<button class="menu" id="menu">☰</button>
<nav class="nav" id="nav">
<a class="{% if page=='home' %}active{% endif %}" href="{{ url_for('home') }}">Home</a>
<a class="{% if page=='about' %}active{% endif %}" href="{{ url_for('about') }}">About</a>
<a class="{% if page=='dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
<a class="{% if page=='story' %}active{% endif %}" href="{{ url_for('story') }}">Story</a>
<a class="{% if page=='faq' %}active{% endif %}" href="{{ url_for('faq') }}">FAQ</a></nav></header>
<main>{% block content %}{% endblock %}</main>
<footer><b>Health<span>360</span></b><p>Smart Healthcare Analytics · Patient Risk & Lifestyle Insights</p><small>© 2026 Health360</small></footer>
<script src="{{ url_for('static', filename='js/site.js') }}"></script></body></html>
